<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画板工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #1e1e2e;
    color: #cdd6f4;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ===== 顶部工具栏 ===== */
  .toolbar {
    background: #181825;
    border-bottom: 1px solid #313244;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    z-index: 10;
  }
  .toolbar h1 {
    font-size: 18px;
    font-weight: 600;
    color: #89b4fa;
    margin-right: 8px;
    white-space: nowrap;
  }
  .tool-group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: #11111b;
    border-radius: 8px;
    border: 1px solid #313244;
  }
  .tool-group label {
    font-size: 12px;
    color: #7f849c;
    white-space: nowrap;
  }

  /* ===== 工具按钮 ===== */
  .btn {
    background: #313244;
    border: 1px solid #45475a;
    color: #cdd6f4;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-width: 38px;
    min-height: 38px;
  }
  .btn:hover { background: #45475a; border-color: #585b70; }
  .btn.active {
    background: #89b4fa;
    border-color: #b4befe;
    color: #11111b;
    font-weight: 600;
  }
  .btn.danger:hover { background: #f38ba8; border-color: #f38ba8; color: #11111b; }
  .btn.primary { background: #a6e3a1; border-color: #a6e3a1; color: #11111b; font-weight: 600; }
  .btn.primary:hover { background: #94d68f; }

  /* ===== 颜色选择 ===== */
  .color-row { display: flex; align-items: center; gap: 8px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 4px; max-width: 280px; }
  .swatch {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px #89b4fa; }
  input[type="color"] {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: 2px solid #45475a; border-radius: 6px; }

  /* ===== 滑块 ===== */
  input[type="range"] {
    -webkit-appearance: none;
    height: 6px;
    background: #313244;
    border-radius: 3px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: #89b4fa;
    border-radius: 50%;
    cursor: pointer;
  }
  .size-display {
    font-size: 12px;
    color: #a6adc8;
    min-width: 32px;
    text-align: center;
  }

  /* ===== 画布容器 ===== */
  .canvas-wrap {
    flex: 1;
    position: relative;
    background: #313244;
    overflow: hidden;
  }
  #board {
    position: absolute;
    top: 0; left: 0;
    background: #ffffff;
    cursor: crosshair;
    touch-action: none;
  }
  #preview {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }

  /* ===== 底部状态栏 ===== */
  .statusbar {
    background: #181825;
    border-top: 1px solid #313244;
    padding: 6px 16px;
    font-size: 12px;
    color: #7f849c;
    display: flex;
    justify-content: space-between;
  }
  .statusbar span b { color: #cdd6f4; }

  .icon { font-size: 16px; line-height: 1; }

  /* ===== 文字输入浮层 ===== */
  .text-overlay {
    position: absolute;
    z-index: 8;
    display: none;
    min-width: 120px;
    background: rgba(255,255,255,0.92);
    border: 1px dashed #89b4fa;
    border-radius: 4px;
    padding: 2px 6px;
    color: #111111;
    outline: none;
    font-size: 16px;
    line-height: 1.2;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .select {
    background: #313244;
    border: 1px solid #45475a;
    color: #cdd6f4;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
    cursor: pointer;
    outline: none;
  }
  .select:hover { border-color: #585b70; }
  input[type="number"] {
    background: #11111b;
    border: 1px solid #45475a;
    color: #cdd6f4;
    border-radius: 6px;
    padding: 5px 6px;
    font-size: 13px;
    outline: none;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn:disabled:hover { background: #313244; border-color: #45475a; }
  .btn.active.text-bold { font-weight: 800; text-decoration: underline; }
</style>
</head>
<body>

<!-- ===== 顶部工具栏 ===== -->
<div class="toolbar">
  <h1>🎨 画板工具</h1>

  <!-- 工具组 -->
  <div class="tool-group" id="toolGroup">
    <button class="btn active" data-tool="brush" title="画笔"><span class="icon">✏️</span></button>
    <button class="btn" data-tool="line" title="直线"><span class="icon">／</span></button>
    <button class="btn" data-tool="rect" title="矩形"><span class="icon">▭</span></button>
    <button class="btn" data-tool="square" title="正方形"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16"></rect></svg></span></button>
    <button class="btn" data-tool="circle" title="圆形"><span class="icon">◯</span></button>
    <button class="btn" data-tool="triangle" title="三角形"><span class="icon">△</span></button>
    <button class="btn" data-tool="ellipse" title="椭圆"><span class="icon">⬭</span></button>
    <button class="btn" data-tool="arrow" title="箭头"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="17" y2="12"></line><polyline points="11 5 18 12 11 19"></polyline></svg></span></button>
    <button class="btn" data-tool="eraser" title="橡皮"><span class="icon">🧽</span></button>
    <button class="btn" data-tool="fill" title="填充"><span class="icon">🪣</span></button>
    <button class="btn" id="cubeBtn" title="立方体（点击即画）"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L21 8 L21 17 L12 22 L3 17 L3 8 Z"></path><path d="M12 3 L12 22"></path><path d="M3 8 L12 13 L21 8"></path><path d="M12 13 L12 22" opacity="0.5"></path></svg></span></button>
    <button class="btn" id="sunBtn" title="太阳（点击即画）"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"></circle><line x1="12" y1="2" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22"></line><line x1="2" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="22" y2="12"></line><line x1="4.9" y1="4.9" x2="6.9" y2="6.9"></line><line x1="17.1" y1="17.1" x2="19.1" y2="19.1"></line><line x1="4.9" y1="19.1" x2="6.9" y2="17.1"></line><line x1="17.1" y1="6.9" x2="19.1" y2="4.9"></line></svg></span></button>
    <button class="btn" id="benzBtn" title="奔驰三叉星（点击即画）"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3 L12 12 L19.5 16.5"></path><path d="M19.5 16.5 L12 12 L4.5 16.5"></path><path d="M4.5 16.5 L12 12 L12 3"></path></svg></span></button>
    <button class="btn" data-tool="text" title="文字"><span class="icon">🅰</span></button>
    <button class="btn" data-tool="select" title="选择/变换"><span class="icon">⬚</span></button>
  </div>

  <!-- 填充模式 -->
  <div class="tool-group">
    <label>填充:</label>
    <button class="btn active" id="strokeMode" title="描边">描边</button>
    <button class="btn" id="fillMode" title="填充">填充</button>
  </div>

  <!-- 颜色 -->
  <div class="tool-group">
    <label>颜色:</label>
    <div class="color-row">
      <input type="color" id="colorPicker" value="#111111">
      <div class="swatches" id="swatches"></div>
    </div>
  </div>

  <!-- 笔触大小 -->
  <div class="tool-group">
    <label>粗细:</label>
    <input type="range" id="sizeSlider" min="1" max="60" value="4">
    <span class="size-display" id="sizeDisplay">4</span>
  </div>

  <!-- 文字工具 -->
  <div class="tool-group" id="textGroup">
    <label>文字:</label>
    <select id="fontSelect" class="select" title="字体">
      <option value='"Microsoft YaHei", sans-serif'>微软雅黑</option>
      <option value='SimSun, serif'>宋体</option>
      <option value='KaiTi, serif'>楷体</option>
      <option value='SimHei, sans-serif'>黑体</option>
      <option value='FangSong, serif'>仿宋</option>
      <option value='Arial, sans-serif'>Arial</option>
      <option value='"Times New Roman", serif'>Times</option>
      <option value='"Comic Sans MS", cursive'>Comic Sans</option>
      <option value='Impact, sans-serif'>Impact</option>
      <option value='monospace'>等宽</option>
    </select>
    <label>字级:</label>
    <input type="number" id="fontSize" min="8" max="200" value="28" style="width:54px">
    <button class="btn" id="boldToggle" title="粗体">B</button>
  </div>

  <!-- 选择/变换工具 -->
  <div class="tool-group" id="transformGroup">
    <label>变换:</label>
    <button class="btn" id="rotLeftBtn" title="逆时针旋转90°" disabled>↺</button>
    <button class="btn" id="rotRightBtn" title="顺时针旋转90°" disabled>↻</button>
    <button class="btn" id="scaleUpBtn" title="放大" disabled>＋</button>
    <button class="btn" id="scaleDownBtn" title="缩小" disabled>－</button>
    <button class="btn danger" id="selDeleteBtn" title="删除选中" disabled>🗑</button>
    <button class="btn primary" id="selConfirmBtn" title="确定（贴回画布）" disabled>✓</button>
    <button class="btn" id="selCancelBtn" title="取消（还原）" disabled>✕</button>
  </div>

  <!-- 操作 -->
  <div class="tool-group">
    <button class="btn" id="undoBtn" title="撤销 (Ctrl+Z)">↶ 撤销</button>
    <button class="btn" id="redoBtn" title="重做 (Ctrl+Y)">↷ 重做</button>
    <button class="btn" id="clearBtn" title="清空">🗑 清空</button>
    <button class="btn primary" id="saveBtn" title="保存为图片">💾 保存</button>
  </div>
</div>

<!-- ===== 画布 ===== -->
<div class="canvas-wrap" id="canvasWrap">
  <canvas id="board"></canvas>
  <canvas id="preview"></canvas>
  <input type="text" id="textOverlay" class="text-overlay" placeholder="输入文字 (Enter确定 / Esc取消)">
</div>

<!-- ===== 状态栏 ===== -->
<div class="statusbar">
  <span>工具: <b id="curTool">画笔</b> ｜ 颜色: <b id="curColor">#111111</b> ｜ 粗细: <b id="curSize">4</b>px</span>
  <span>坐标: <b id="coords">0, 0</b></span>
</div>

<script>
(function () {
  const board = document.getElementById('board');
  const preview = document.getElementById('preview');
  const ctx = board.getContext('2d');
  const pctx = preview.getContext('2d');
  const wrap = document.getElementById('canvasWrap');

  // ===== 状态 =====
  const state = {
    tool: 'brush',
    color: '#111111',
    size: 4,
    fillMode: false,        // false=描边, true=填充
    drawing: false,
    startX: 0, startY: 0,
    lastX: 0, lastY: 0,
    history: [],
    historyIndex: -1,
    // 文字
    font: '"Microsoft YaHei", sans-serif',
    fontSize: 28,
    bold: false,
    // 选择/变换
    sel: {
      active: false,        // 是否有浮动的选中图层
      selecting: false,     // 正在拖框选择
      moving: false,
      x: 0, y: 0, w: 0, h: 0,   // 浮动图层在预览画布上的位置与尺寸
      img: null,            // offscreen canvas，存放选中像素
      original: null,       // ImageData，取消时还原用
      dragOffX: 0, dragOffY: 0,
      curX0: 0, curY0: 0, curX1: 0, curY1: 0,  // 拖框当前矩形
    },
  };

  const TOOL_NAMES = {
    brush: '画笔', line: '直线', rect: '矩形', square: '正方形', circle: '圆形',
    triangle: '三角形', ellipse: '椭圆', arrow: '箭头', eraser: '橡皮', fill: '填充',
    text: '文字', select: '选择'
  };

  const PALETTE = [
    '#111111','#ffffff','#f38ba8','#fab387','#f9e2af','#a6e3a1','#94e2d5','#89b4fa',
    '#cba6f7','#f5c2e7','#94d68f','#e6c389','#d20f2d','#1e66f5','#7280f6','#40a02b',
    '#fe4020','#ff8c00','#ffd700','#00b894','#0984e3','#6c5ce7','#fd79a8','#e17055'
  ];

  // ===== 调色板 =====
  const swatchEl = document.getElementById('swatches');
  PALETTE.forEach((c, i) => {
    const s = document.createElement('div');
    s.className = 'swatch' + (i === 0 ? ' active' : '');
    s.style.background = c;
    s.dataset.color = c;
    s.title = c;
    s.addEventListener('click', () => {
      state.color = c;
      document.getElementById('colorPicker').value = c;
      document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
      s.classList.add('active');
      updateStatus();
    });
    swatchEl.appendChild(s);
  });

  document.getElementById('colorPicker').addEventListener('input', e => {
    state.color = e.target.value;
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    updateStatus();
  });

  // ===== 工具切换 =====
  document.querySelectorAll('#toolGroup .btn').forEach(b => {
    b.addEventListener('click', () => {
      // 图章按钮（立方体/太阳/奔驰）没有 data-tool，不参与工具切换
      if (!b.dataset.tool) return;
      // 离开当前工具前的清理
      if (textOverlay.style.display === 'block') commitText();
      if (state.tool === 'select' && b.dataset.tool !== 'select') cancelSelection();

      document.querySelectorAll('#toolGroup .btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.tool = b.dataset.tool;
      const cursors = { fill: 'cell', text: 'text', select: 'default' };
      board.style.cursor = cursors[state.tool] || 'crosshair';
      updateStatus();
    });
  });

  // ===== 填充模式 =====
  const strokeBtn = document.getElementById('strokeMode');
  const fillBtn = document.getElementById('fillMode');
  strokeBtn.addEventListener('click', () => {
    state.fillMode = false;
    strokeBtn.classList.add('active'); fillBtn.classList.remove('active');
  });
  fillBtn.addEventListener('click', () => {
    state.fillMode = true;
    fillBtn.classList.add('active'); strokeBtn.classList.remove('active');
  });

  // ===== 粗细 =====
  const sizeSlider = document.getElementById('sizeSlider');
  const sizeDisplay = document.getElementById('sizeDisplay');
  sizeSlider.addEventListener('input', e => {
    state.size = parseInt(e.target.value, 10);
    sizeDisplay.textContent = state.size;
    updateStatus();
  });

  // ===== 文字：字体 / 字级 / 粗体 =====
  const fontSelect = document.getElementById('fontSelect');
  const fontSizeInput = document.getElementById('fontSize');
  const boldToggle = document.getElementById('boldToggle');
  fontSelect.addEventListener('change', e => { state.font = e.target.value; });
  fontSizeInput.addEventListener('input', e => {
    const v = parseInt(e.target.value, 10);
    if (!isNaN(v) && v > 0) state.fontSize = v;
  });
  boldToggle.addEventListener('click', () => {
    state.bold = !state.bold;
    boldToggle.classList.toggle('active', state.bold);
    boldToggle.classList.toggle('text-bold', state.bold);
  });

  // ===== 选择/变换按钮引用 =====
  const SEL_BTNS = ['rotLeftBtn','rotRightBtn','scaleUpBtn','scaleDownBtn','selDeleteBtn','selConfirmBtn','selCancelBtn']
    .map(id => document.getElementById(id));
  function setSelBtnsEnabled(on) {
    SEL_BTNS.forEach(b => b.disabled = !on);
  }

  // 在 preview 上绘制当前浮动选中图层 / 拖框
  function drawSelection() {
    pctx.clearRect(0, 0, preview.width, preview.height);
    const s = state.sel;
    if (s.selecting) {
      // 拖框（虚线矩形）
      const x = Math.min(s.curX0, s.curX1), y = Math.min(s.curY0, s.curY1);
      const w = Math.abs(s.curX1 - s.curX0), h = Math.abs(s.curY1 - s.curY0);
      pctx.save();
      pctx.setLineDash([6, 4]);
      pctx.strokeStyle = '#89b4fa';
      pctx.lineWidth = 1.5;
      pctx.strokeRect(x, y, w, h);
      pctx.fillStyle = 'rgba(137,180,250,0.12)';
      pctx.fillRect(x, y, w, h);
      pctx.restore();
      return;
    }
    if (s.active && s.img) {
      pctx.drawImage(s.img, s.x, s.y, s.w, s.h);
      pctx.save();
      pctx.setLineDash([6, 4]);
      pctx.strokeStyle = '#89b4fa';
      pctx.lineWidth = 1.5;
      pctx.strokeRect(s.x, s.y, s.w, s.h);
      pctx.restore();
    }
  }

  // 把选中图层贴回 board
  function commitSelection() {
    const s = state.sel;
    if (!s.active || !s.img) return;
    ctx.drawImage(s.img, s.x, s.y, s.w, s.h);
    clearSelection();
    pctx.clearRect(0, 0, preview.width, preview.height);
    saveHistory();
  }
  // 取消：把原像素还原回 board
  function cancelSelection() {
    const s = state.sel;
    if (!s.active) { clearSelection(); return; }
    if (s.original) ctx.putImageData(s.original, Math.round(s.origX), Math.round(s.origY));
    clearSelection();
    pctx.clearRect(0, 0, preview.width, preview.height);
    saveHistory();
  }
  function clearSelection() {
    const s = state.sel;
    s.active = false; s.selecting = false; s.moving = false;
    s.img = null; s.original = null;
    setSelBtnsEnabled(false);
  }

  // 框选完成后，把区域内像素“抬起”为浮动图层
  function liftRegion(x0, y0, x1, y1) {
    const s = state.sel;
    const x = Math.max(0, Math.round(Math.min(x0, x1)));
    const y = Math.max(0, Math.round(Math.min(y0, y1)));
    const w = Math.min(board.width - x, Math.round(Math.abs(x1 - x0)));
    const h = Math.min(board.height - y, Math.round(Math.abs(y1 - y0)));
    if (w < 2 || h < 2) return;
    // 保存原图像素用于取消还原
    s.original = ctx.getImageData(x, y, w, h);
    s.origX = x; s.origY = y;
    // 抬起像素到 offscreen canvas
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    off.getContext('2d').drawImage(board, x, y, w, h, 0, 0, w, h);
    // 在 board 上清除该区域（用白色覆盖）
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x, y, w, h);
    s.img = off;
    s.x = x; s.y = y; s.w = w; s.h = h;
    s.active = true;
    setSelBtnsEnabled(true);
    drawSelection();
  }

  // 旋转 90°（dir: 1=顺时针, -1=逆时针）
  function rotateSelection(dir) {
    const s = state.sel;
    if (!s.active || !s.img) return;
    const ow = s.img.width, oh = s.img.height;
    const off = document.createElement('canvas');
    off.width = oh; off.height = ow;   // 宽高互换
    const octx = off.getContext('2d');
    octx.translate(off.width / 2, off.height / 2);
    octx.rotate(dir * Math.PI / 2);
    octx.drawImage(s.img, -ow / 2, -oh / 2);
    // 保持中心位置不变
    const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
    s.img = off;
    s.w = off.width; s.h = off.height;
    s.x = cx - s.w / 2; s.y = cy - s.h / 2;
    drawSelection();
  }

  // 缩放（factor: >1 放大, <1 缩小）
  function scaleSelection(factor) {
    const s = state.sel;
    if (!s.active || !s.img) return;
    const nw = Math.max(4, Math.round(s.w * factor));
    const nh = Math.max(4, Math.round(s.h * factor));
    const off = document.createElement('canvas');
    off.width = nw; off.height = nh;
    off.getContext('2d').drawImage(s.img, 0, 0, nw, nh);
    const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
    s.img = off;
    s.w = nw; s.h = nh;
    s.x = cx - s.w / 2; s.y = cy - s.h / 2;
    drawSelection();
  }

  document.getElementById('rotLeftBtn').addEventListener('click', () => rotateSelection(-1));
  document.getElementById('rotRightBtn').addEventListener('click', () => rotateSelection(1));
  document.getElementById('scaleUpBtn').addEventListener('click', () => scaleSelection(1.2));
  document.getElementById('scaleDownBtn').addEventListener('click', () => scaleSelection(1 / 1.2));
  document.getElementById('selDeleteBtn').addEventListener('click', () => {
    clearSelection();
    pctx.clearRect(0, 0, preview.width, preview.height);
    saveHistory();
  });
  document.getElementById('selConfirmBtn').addEventListener('click', commitSelection);
  document.getElementById('selCancelBtn').addEventListener('click', cancelSelection);

  // ===== 画布尺寸 =====
  function resize() {
    const r = wrap.getBoundingClientRect();
    // 保留已有内容
    const tmp = document.createElement('canvas');
    tmp.width = board.width || r.width;
    tmp.height = board.height || r.height;
    if (board.width) tmp.getContext('2d').drawImage(board, 0, 0);

    board.width = r.width;
    board.height = r.height;
    preview.width = r.width;
    preview.height = r.height;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, board.width, board.height);
    if (tmp.width) ctx.drawImage(tmp, 0, 0);
    if (state.history.length === 0) saveHistory();
  }
  window.addEventListener('resize', resize);

  // ===== 坐标转换 =====
  function getPos(e) {
    const rect = board.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  // ===== 绘制辅助 =====
  function applyStyle(c) {
    c.strokeStyle = state.color;
    c.fillStyle = state.color;
    c.lineWidth = state.size;
    c.lineCap = 'round';
    c.lineJoin = 'round';
  }

  function drawShape(c, tool, x0, y0, x1, y1) {
    applyStyle(c);
    c.beginPath();
    switch (tool) {
      case 'line':
        c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
        break;
      case 'rect': {
        const w = x1 - x0, h = y1 - y0;
        if (state.fillMode) c.fillRect(x0, y0, w, h);
        else c.strokeRect(x0, y0, w, h);
        break;
      }
      case 'square': {
        const side = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
        const w = (x1 >= x0 ? 1 : -1) * side;
        const h = (y1 >= y0 ? 1 : -1) * side;
        if (state.fillMode) c.fillRect(x0, y0, w, h);
        else c.strokeRect(x0, y0, w, h);
        break;
      }
      case 'circle': {
        const r = Math.max(1, Math.hypot(x1 - x0, y1 - y0));
        c.arc(x0, y0, r, 0, Math.PI * 2);
        state.fillMode ? c.fill() : c.stroke();
        break;
      }
      case 'ellipse': {
        const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
        const rx = Math.max(1, Math.abs(x1 - x0) / 2);
        const ry = Math.max(1, Math.abs(y1 - y0) / 2);
        c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        state.fillMode ? c.fill() : c.stroke();
        break;
      }
      case 'triangle': {
        const cx = (x0 + x1) / 2;
        c.moveTo(cx, y0);
        c.lineTo(x0, y1);
        c.lineTo(x1, y1);
        c.closePath();
        state.fillMode ? c.fill() : c.stroke();
        break;
      }
      case 'arrow': {
        const head = Math.max(10, state.size * 3);
        const ang = Math.atan2(y1 - y0, x1 - x0);
        c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
        c.beginPath();
        c.moveTo(x1, y1);
        c.lineTo(x1 - head * Math.cos(ang - Math.PI / 6), y1 - head * Math.sin(ang - Math.PI / 6));
        c.lineTo(x1 - head * Math.cos(ang + Math.PI / 6), y1 - head * Math.sin(ang + Math.PI / 6));
        c.closePath(); c.fill();
        break;
      }
    }
  }

  // ===== 立方体（等距投影） =====
  function drawCube(c, cx, cy, size) {
    applyStyle(c);
    const s = Math.max(20, size);
    // 等距投影偏移量
    const dx = s * 0.5;   // 水平偏移（左右两面）
    const dy = s * 0.35;  // 垂直偏移（顶面/底面）
    // 前面四角
    const flx = cx - s / 2, frx = cx + s / 2;
    const fty = cy - s / 2 + dy, fby = cy + s / 2 + dy;
    // 顶面后角
    const trx = cx + dx, tryy = cy - s / 2;
    const tlx = cx - dx;

    // 顶面
    c.beginPath();
    c.moveTo(cx - s / 2, cy - s / 2);          // 前左上
    c.lineTo(cx + s / 2, cy - s / 2);          // 前右上
    c.lineTo(trx, tryy);                         // 后右上
    c.lineTo(tlx, tryy);                         // 后左上
    c.closePath();
    state.fillMode ? c.fill() : c.stroke();

    // 左面
    c.beginPath();
    c.moveTo(cx - s / 2, cy - s / 2);          // 前左上
    c.lineTo(tlx, tryy);                         // 后左上
    c.lineTo(tlx, cy + s / 2);                   // 后左下
    c.lineTo(cx - s / 2, cy + s / 2);           // 前左下
    c.closePath();
    state.fillMode ? c.fill() : c.stroke();

    // 正面
    c.beginPath();
    c.moveTo(cx - s / 2, cy - s / 2);
    c.lineTo(cx + s / 2, cy - s / 2);
    c.lineTo(cx + s / 2, cy + s / 2);
    c.lineTo(cx - s / 2, cy + s / 2);
    c.closePath();
    state.fillMode ? c.fill() : c.stroke();

    // 正面边线（确保描边模式下正面边线清晰）
    if (!state.fillMode) {
      c.beginPath();
      c.moveTo(cx - s / 2, cy - s / 2);
      c.lineTo(cx + s / 2, cy - s / 2);
      c.lineTo(cx + s / 2, cy + s / 2);
      c.lineTo(cx - s / 2, cy + s / 2);
      c.closePath();
      c.stroke();
    }
  }

  // ===== 太阳 =====
  function drawSun(c, cx, cy, size) {
    applyStyle(c);
    const r = Math.max(15, size / 2);   // 中心圆半径
    const inner = r * 0.55;             // 内圆
    const outer = r * 1.55;             // 光线外端
    const rays = 12;

    // 中心圆
    c.beginPath();
    c.arc(cx, cy, inner, 0, Math.PI * 2);
    state.fillMode ? c.fill() : c.stroke();

    // 光线
    for (let i = 0; i < rays; i++) {
      const ang = (Math.PI * 2 / rays) * i;
      const x1 = cx + Math.cos(ang) * r;
      const y1 = cy + Math.sin(ang) * r;
      const x2 = cx + Math.cos(ang) * outer;
      const y2 = cy + Math.sin(ang) * outer;
      c.beginPath();
      c.moveTo(x1, y1);
      c.lineTo(x2, y2);
      c.stroke();
    }
  }

  // ===== 奔驰三叉星徽 (Mercedes-Benz) =====
  function drawBenz(c, cx, cy, size) {
    applyStyle(c);
    const r = Math.max(25, size / 2);
    const startAng = -Math.PI / 2; // 从正上方开始
    // 三叉星三个顶点：正上、右下、左下（相隔 120°）
    const tips = [
      { x: cx + r * Math.cos(startAng),                    y: cy + r * Math.sin(startAng) },                    // 正上
      { x: cx + r * Math.cos(startAng + Math.PI * 2 / 3),  y: cy + r * Math.sin(startAng + Math.PI * 2 / 3) },  // 右下
      { x: cx + r * Math.cos(startAng + Math.PI * 4 / 3),  y: cy + r * Math.sin(startAng + Math.PI * 4 / 3) },  // 左下
    ];

    // 外圆环
    c.beginPath();
    c.arc(cx, cy, r, 0, Math.PI * 2);
    state.fillMode ? c.fill() : c.stroke();

    if (!state.fillMode) {
      // 三叉星：从圆心到三个顶点的三条线
      c.beginPath();
      c.moveTo(cx, cy); c.lineTo(tips[0].x, tips[0].y);
      c.moveTo(cx, cy); c.lineTo(tips[1].x, tips[1].y);
      c.moveTo(cx, cy); c.lineTo(tips[2].x, tips[2].y);
      c.stroke();
    } else {
      // 填充模式：填三个扇形组成完整三叉星徽
      for (let i = 0; i < 3; i++) {
        c.beginPath();
        c.moveTo(cx, cy);
        const a0 = startAng + i * (Math.PI * 2 / 3);
        c.arc(cx, cy, r, a0, a0 + Math.PI * 2 / 3);
        c.closePath();
        c.fill();
      }
    }
  }

  // ===== 点击即画的图章工具 =====
  function stampAt(drawFn) {
    // 在画布中央略带随机偏移地盖章，连点多次不会完全重叠
    const cx = board.width / 2 + (Math.random() - 0.5) * board.width * 0.3;
    const cy = board.height / 2 + (Math.random() - 0.5) * board.height * 0.3;
    const size = 60 + state.size * 6;  // 随笔触粗细缩放
    drawFn(ctx, cx, cy, size);
    saveHistory();
  }
  document.getElementById('cubeBtn').addEventListener('click', () => stampAt(drawCube));
  document.getElementById('sunBtn').addEventListener('click', () => stampAt(drawSun));
  document.getElementById('benzBtn').addEventListener('click', () => stampAt(drawBenz));

  // ===== 油漆桶填充 (flood fill) =====
  function floodFill(sx, sy, hex) {
    const w = board.width, h = board.height;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const idx = (sy * w + sx) * 4;
    const target = [d[idx], d[idx+1], d[idx+2], d[idx+3]];
    const rgb = hexToRgb(hex);
    if (target[0] === rgb.r && target[1] === rgb.g && target[2] === rgb.b) return;

    const stack = [[sx, sy]];
    while (stack.length) {
      const [x, y] = stack.pop();
      if (x < 0 || y < 0 || x >= w || y >= h) continue;
      const i = (y * w + x) * 4;
      if (d[i] !== target[0] || d[i+1] !== target[1] || d[i+2] !== target[2] || d[i+3] !== target[3]) continue;
      d[i] = rgb.r; d[i+1] = rgb.g; d[i+2] = rgb.b; d[i+3] = 255;
      stack.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
    }
    ctx.putImageData(img, 0, 0);
  }
  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
    return { r: parseInt(hex.substr(0,2),16), g: parseInt(hex.substr(2,2),16), b: parseInt(hex.substr(4,2),16) };
  }

  // ===== 文字输入浮层 =====
  const textOverlay = document.getElementById('textOverlay');
  let textPos = { x: 0, y: 0 };
  function openTextInput(p) {
    // 若已有打开的输入框，先提交再开新的
    if (textOverlay.style.display === 'block') commitText();
    textPos = p;
    textOverlay.style.left = p.x + 'px';
    textOverlay.style.top = (p.y - state.fontSize / 2) + 'px';
    textOverlay.style.fontFamily = state.font;
    textOverlay.style.fontSize = state.fontSize + 'px';
    textOverlay.style.fontWeight = state.bold ? '700' : '400';
    textOverlay.style.color = state.color;
    textOverlay.style.display = 'block';
    textOverlay.value = '';
    setTimeout(() => textOverlay.focus(), 0);
  }
  function commitText() {
    if (textOverlay.style.display !== 'block') return;
    const txt = textOverlay.value;
    textOverlay.style.display = 'none';
    if (!txt) return;
    ctx.fillStyle = state.color;
    ctx.textBaseline = 'middle';
    ctx.font = (state.bold ? 'bold ' : '') + state.fontSize + 'px ' + state.font;
    ctx.fillText(txt, textPos.x, textPos.y);
    saveHistory();
  }
  textOverlay.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commitText(); }
    else if (e.key === 'Escape') { e.preventDefault(); textOverlay.style.display = 'none'; }
  });
  textOverlay.addEventListener('blur', () => { setTimeout(commitText, 50); });

  // ===== 选择/变换 事件处理 =====
  function selectStart(p) {
    const s = state.sel;
    if (s.active && p.x >= s.x && p.x <= s.x + s.w && p.y >= s.y && p.y <= s.y + s.h) {
      // 点中浮动图层 → 开始拖动移动
      s.moving = true;
      s.dragOffX = p.x - s.x; s.dragOffY = p.y - s.y;
      state.drawing = true;
      return;
    }
    if (s.active) commitSelection();   // 在外部点新区域 → 先贴回再选新的
    s.selecting = true;
    s.curX0 = s.curX1 = p.x;
    s.curY0 = s.curY1 = p.y;
    state.drawing = true;
  }
  function selectMove(p) {
    const s = state.sel;
    if (s.moving) {
      s.x = p.x - s.dragOffX; s.y = p.y - s.dragOffY;
      drawSelection();
      return;
    }
    if (s.selecting) {
      s.curX1 = p.x; s.curY1 = p.y;
      drawSelection();
    }
  }
  function selectEnd() {
    const s = state.sel;
    if (!state.drawing) return;
    state.drawing = false;
    if (s.moving) { s.moving = false; drawSelection(); return; }
    if (s.selecting) {
      s.selecting = false;
      liftRegion(s.curX0, s.curY0, s.curX1, s.curY1);
    }
  }

  // ===== 事件 =====
  function start(e) {
    e.preventDefault();
    const p = getPos(e);
    state.startX = state.lastX = p.x;
    state.startY = state.lastY = p.y;

    if (state.tool === 'text') { openTextInput(p); return; }
    if (state.tool === 'select') { selectStart(p); return; }
    if (state.tool === 'fill') {
      floodFill(Math.floor(p.x), Math.floor(p.y), state.color);
      saveHistory();
      return;
    }
    state.drawing = true;

    if (state.tool === 'brush' || state.tool === 'eraser') {
      applyStyle(ctx);
      if (state.tool === 'eraser') {
        ctx.strokeStyle = '#ffffff';
        ctx.fillStyle = '#ffffff';
      }
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      // 画一个点
      ctx.lineTo(p.x + 0.01, p.y + 0.01);
      ctx.stroke();
    }
  }

  function move(e) {
    e.preventDefault();
    const p = getPos(e);
    document.getElementById('coords').textContent = Math.round(p.x) + ', ' + Math.round(p.y);
    if (state.tool === 'select') { if (state.drawing) selectMove(p); return; }
    if (!state.drawing) return;

    if (state.tool === 'brush' || state.tool === 'eraser') {
      applyStyle(ctx);
      if (state.tool === 'eraser') { ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff'; }
      ctx.beginPath();
      ctx.moveTo(state.lastX, state.lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      state.lastX = p.x; state.lastY = p.y;
    } else {
      // 形状预览
      pctx.clearRect(0, 0, preview.width, preview.height);
      drawShape(pctx, state.tool, state.startX, state.startY, p.x, p.y);
    }
  }

  function end(e) {
    if (state.tool === 'select') { selectEnd(); return; }
    if (!state.drawing) return;
    e.preventDefault();
    state.drawing = false;

    if (state.tool !== 'brush' && state.tool !== 'eraser') {
      const p = getPos(e.changedTouches ? { touches: e.changedTouches } : e);
      pctx.clearRect(0, 0, preview.width, preview.height);
      drawShape(ctx, state.tool, state.startX, state.startY, p.x, p.y);
    }
    saveHistory();
  }

  board.addEventListener('mousedown', start);
  board.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  board.addEventListener('touchstart', start, { passive: false });
  board.addEventListener('touchmove', move, { passive: false });
  board.addEventListener('touchend', end, { passive: false });

  // ===== 历史记录 =====
  function saveHistory() {
    state.history = state.history.slice(0, state.historyIndex + 1);
    state.history.push(board.toDataURL());
    state.historyIndex++;
    if (state.history.length > 40) {
      state.history.shift();
      state.historyIndex--;
    }
  }
  function restore(index) {
    if (index < 0 || index >= state.history.length) return;
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, board.width, board.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = state.history[index];
  }
  document.getElementById('undoBtn').addEventListener('click', () => {
    if (state.historyIndex > 0) { state.historyIndex--; restore(state.historyIndex); }
  });
  document.getElementById('redoBtn').addEventListener('click', () => {
    if (state.historyIndex < state.history.length - 1) { state.historyIndex++; restore(state.historyIndex); }
  });

  // ===== 清空 / 保存 =====
  document.getElementById('clearBtn').addEventListener('click', () => {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, board.width, board.height);
    saveHistory();
  });
  document.getElementById('saveBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = '画板作品_' + Date.now() + '.png';
    link.href = board.toDataURL('image/png');
    link.click();
  });

  // ===== 快捷键 =====
  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'z') { e.preventDefault(); document.getElementById('undoBtn').click(); }
      if (e.key === 'y') { e.preventDefault(); document.getElementById('redoBtn').click(); }
      if (e.key === 's') { e.preventDefault(); document.getElementById('saveBtn').click(); }
    }
  });

  // ===== 状态栏更新 =====
  function updateStatus() {
    document.getElementById('curTool').textContent = TOOL_NAMES[state.tool];
    document.getElementById('curColor').textContent = state.color;
    document.getElementById('curSize').textContent = state.size;
  }

  // ===== 初始化 =====
  resize();
  updateStatus();
})();
</script>
</body>
</html>
